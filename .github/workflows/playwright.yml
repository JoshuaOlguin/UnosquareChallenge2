name: Run Playwright and TypeScript Tests

on:
  push:
    branches:
      - Master
      - main

  pull_request:
    branches:
      - Master
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # Publish test results in GitHub Actions
      - name: Publish Playwright Test Results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Tests
          path: test-results/results.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
          list-suites: all
          list-tests: all
          use-actions-summary: true

      # Upload HTML Playwright report
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Upload screenshots, videos and traces
      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30